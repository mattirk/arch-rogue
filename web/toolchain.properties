# Pinned web (Emscripten/WebAssembly) toolchain and payload contract.
# This file is deliberately both shell-sourceable and Java Properties syntax.
EMSDK_VERSION=6.0.7
RAYLIB_VERSION=6.0
RAYLIB_COMMIT=dbc56a87da87d973a9c5baa4e7438a9d20121d28
RAYLIB_SOURCE_URL=https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz
RAYLIB_SOURCE_SHA256=2b3ee1e2120c7a0796b33062c7e9a694dd8a8caa56a96319ac8c8ecf54a90d0b
# WebGL2-only contract: the vendored archive is compiled for OpenGL ES 3.0 and
# the link requires a WebGL2 context. No WebGL1/GLES2 fallback is built.
WEB_GRAPHICS=GRAPHICS_API_OPENGL_ES3
# Pinned Emscripten heap policy: fixed INITIAL_MEMORY, growth disabled. Measured
# decoded-memory use is recorded against this ceiling by the web perf harness.
WEB_INITIAL_MEMORY_BYTES=268435456
WEB_STACK_SIZE_BYTES=4194304
WEB_ALLOW_MEMORY_GROWTH=0
# Declared initial-download budget (bytes on the wire for html+js+wasm+core
# data, using Brotli sizes when .br siblings exist). web-preflight declares it;
# web-audit enforces it. Lazy packs are excluded by design.
WEB_INITIAL_DOWNLOAD_BUDGET_BYTES=29360128
