# nginx reverse proxy for the Arch Rogue multiplayer relay at ar.rita-kasari.fi.
# Install as /etc/nginx/conf.d/ar.rita-kasari.fi.conf (or sites-available +
# symlink), then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Public TLS terminates here (MULTIPLAYER.md D2). The relay itself listens on
# plaintext WebSocket at 127.0.0.1:$PORT and never on a public interface.
# The old Python relay used nginx's `stream` block on 43666; that block can be
# removed once this is live — the Odin clients only speak wss://.../mp.
#
# Replace RELAY_PORT below with the PORT variable of the GitHub Environment
# "ar-rita-kasari-fi" (the port the relay unit binds), and point the
# certificate paths at the existing Let's Encrypt lineage for this host.

upstream arch_rogue_relay {
    server 127.0.0.1:RELAY_PORT;
    keepalive 8;
}

# Per-client limits (security audit 2026-10-11, finding 1). One address may
# hold a few sockets (a household behind NAT, reconnects overlapping the old
# socket) and open handshakes at a modest rate; the relay applies its own
# per-source room/connection caps on X-Forwarded-For behind this.
limit_conn_zone $binary_remote_addr zone=ar_relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=ar_relay_req:10m rate=5r/s;
limit_conn_status 429;
limit_req_status 429;

# Close the WebSocket Upgrade handshake correctly: pass "upgrade" only when
# the client asked for it, "" otherwise so keepalive does not inherit it.
map $http_upgrade $arch_rogue_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ar.rita-kasari.fi;

    # certbot --webroot renewals keep working on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ar.rita-kasari.fi;

    ssl_certificate     /etc/letsencrypt/live/ar.rita-kasari.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ar.rita-kasari.fi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ar_relay:5m;

    # No static site here: everything but the two relay routes is refused.
    location / {
        return 404;
    }

    # Minimal health response from the relay (no room/player data).
    location = /healthz {
        limit_req zone=ar_relay_req burst=10 nodelay;
        proxy_pass http://arch_rogue_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # The game's single WebSocket endpoint (subprotocol arch-rogue.v4).
    location = /mp {
        limit_conn ar_relay_conn 8;
        limit_req zone=ar_relay_req burst=10 nodelay;
        # Privacy policy commitment: no access log of player connections.
        # Failures can still land in error_log/journald, which the host keeps
        # for at most 30 days (deploy/README.md "Log retention").
        access_log off;
        proxy_pass http://arch_rogue_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arch_rogue_connection;
        proxy_set_header Host $host;
        # Browsers send Origin; the relay enforces its allowlist on it.
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Clients heartbeat every 5 s; the relay drops silent peers at 15 s.
        # Keep the proxy from timing out an idle-but-alive socket first.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
        # Frames are at most 256 KiB application messages; let them stream.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
