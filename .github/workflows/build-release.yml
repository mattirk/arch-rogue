name: Build & Release

# Canonical source: tools/public-repo/workflows/build-release.yml in the
# private master repository. The mirror overlays this file into
# .github/workflows/ of the public repository.

"on":
  push:
    branches: [master]
    paths-ignore:
      - "arch-rogue-python/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Validate and package Linux x64
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha12: ${{ steps.metadata.outputs.sha12 }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Inject manifest-locked licensed SFX
        env:
          ARCH_ROGUE_SFX_RELEASE_API_URL: https://api.github.com/repos/mattirk/arch-rogue-master/releases/tags/sfx-runtime
          ARCH_ROGUE_SFX_BUNDLE_AUTHORIZATION: ${{ secrets.ARCH_ROGUE_SFX_BUNDLE_AUTHORIZATION }}
        run: bash tools/fetch_private_sfx.sh

      - name: Read pinned toolchain metadata
        id: toolchain
        shell: bash
        run: bash tools/verify_toolchain.sh metadata >> "$GITHUB_OUTPUT"

      - name: Install raylib, Xvfb, and verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            file \
            libasound2-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            python3-pil \
            rsync \
            xauth \
            xvfb

      - name: Build exact Odin tag from source
        uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2
        with:
          release: "false"
          branch: ${{ steps.toolchain.outputs.odin_version }}
          llvm-version: ${{ steps.toolchain.outputs.odin_llvm_major }}
          build-type: release
          cache: "false"

      - name: Verify exact Odin snapshot
        run: bash tools/verify_toolchain.sh odin

      - name: Verify Linux raylib ABI baseline
        run: python3 tools/verify_linux_raylib.py

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION[[:space:]]*::[[:space:]]*"\([^"]*\)".*/\1/p' src/main.odin)"
          [[ -n "$version" ]] || { echo "VERSION is missing from src/main.odin" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check Odin sources
        run: bash build.sh check

      - name: Run Odin tests
        run: bash build.sh test

      - name: Build optimized Linux binary
        run: bash build.sh release

      - name: Verify authored asset packs
        run: |
          python3 tools/verify_actor_assets.py
          python3 tools/verify_story_assets.py
          python3 tools/verify_chronicle_assets.py

      - name: Run public-mirror and website regressions
        run: python3 -m unittest tests.test_sfx_bundle tests.test_public_mirror tests.test_website tests.test_repository_layout

      - name: Assemble Linux distribution
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.metadata.outputs.version }}"
          sha12="${{ steps.metadata.outputs.sha12 }}"
          archive="arch-rogue-v${version}-${sha12}-linux-x64.tar.gz"
          package_root="dist/package/arch-rogue"

          rm -rf dist/package
          install -d "$package_root/bin" "$package_root/licenses"
          install -m 0755 build/archrogue "$package_root/bin/archrogue"
          install -m 0644 README.md "$package_root/README.md"
          cp -a assets "$package_root/assets"
          install -m 0644 LICENSE "$package_root/licenses/ARCH_ROGUE_LICENSE.txt"
          install -m 0644 NOTICE "$package_root/licenses/ARCH_ROGUE_NOTICE.txt"
          install -m 0644 vendor/raylib/LICENSE "$package_root/licenses/RAYLIB_LICENSE.txt"
          cat > "$package_root/arch-rogue" <<'SH'
          #!/usr/bin/env sh
          set -eu
          root="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          cd "$root"
          exec "$root/bin/archrogue" "$@"
          SH
          chmod 0755 "$package_root/arch-rogue"

          if find "$package_root" -type l -print -quit | grep -q .; then
            echo "Linux package must not contain symbolic links" >&2
            exit 1
          fi
          file "$package_root/bin/archrogue"
          ldd "$package_root/bin/archrogue"
          if ldd "$package_root/bin/archrogue" | grep -q 'not found'; then
            echo "Linux binary has unresolved runtime libraries" >&2
            exit 1
          fi

          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "dist/$archive" -C dist/package arch-rogue
          tar -tzf "dist/$archive" > dist/linux-package-contents.txt
          grep -Fxq 'arch-rogue/arch-rogue' dist/linux-package-contents.txt
          grep -Fxq 'arch-rogue/bin/archrogue' dist/linux-package-contents.txt
          grep -Fxq 'arch-rogue/README.md' dist/linux-package-contents.txt
          grep -Fxq 'arch-rogue/licenses/ARCH_ROGUE_LICENSE.txt' dist/linux-package-contents.txt
          grep -Fxq 'arch-rogue/licenses/ARCH_ROGUE_NOTICE.txt' dist/linux-package-contents.txt
          grep -Fxq 'arch-rogue/licenses/RAYLIB_LICENSE.txt' dist/linux-package-contents.txt
          grep -Fq 'arch-rogue/assets/' dist/linux-package-contents.txt
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke packaged build under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/smoke
          mkdir -p build/smoke
          tar -xzf "${{ steps.package.outputs.archive }}" -C build/smoke
          timeout 45s xvfb-run -a -s '-screen 0 1280x720x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 \
                ARCH_ROGUE_SHOT=smoke.png \
                ARCH_ROGUE_SHOT_FRAME=5 \
                build/smoke/arch-rogue/arch-rogue
          test -s build/smoke/arch-rogue/smoke.png

      - name: Upload Linux release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-rogue-linux-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build signed Android APK and AAB
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: android-release
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Inject manifest-locked licensed SFX
        env:
          ARCH_ROGUE_SFX_RELEASE_API_URL: https://api.github.com/repos/mattirk/arch-rogue-master/releases/tags/sfx-runtime
          ARCH_ROGUE_SFX_BUNDLE_AUTHORIZATION: ${{ secrets.ARCH_ROGUE_SFX_BUNDLE_AUTHORIZATION }}
        run: bash tools/fetch_private_sfx.sh

      - name: Read pinned toolchain metadata
        id: toolchain
        shell: bash
        run: bash tools/verify_toolchain.sh metadata >> "$GITHUB_OUTPUT"

      - name: Set up pinned JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_major }}

      - name: Build exact Odin tag from source
        uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2
        with:
          release: "false"
          branch: ${{ steps.toolchain.outputs.odin_version }}
          llvm-version: ${{ steps.toolchain.outputs.odin_llvm_major }}
          build-type: release
          cache: "false"

      - name: Verify exact Odin snapshot
        run: bash tools/verify_toolchain.sh odin

      - name: Install pinned Android host prerequisites and Clang
        shell: bash
        run: |
          set -euo pipefail
          clang_version="${{ steps.toolchain.outputs.odin_ir_clang_version }}"
          clang_major="${{ steps.toolchain.outputs.odin_ir_clang_major }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg unzip xz-utils zip
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes \
                --output /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$clang_major main" \
            | sudo tee "/etc/apt/sources.list.d/llvm-$clang_major.list" >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-$clang_major"

          clang_bin="$(command -v "clang-$clang_major")"
          actual_clang_version="$($clang_bin --version | sed -n '1s/^.*clang version \([^ ]*\).*$/\1/p')"
          [[ "$actual_clang_version" == "$clang_version" ]] || {
            echo "expected Clang $clang_version, found ${actual_clang_version:-unknown}" >&2
            exit 1
          }
          echo "ODIN_ANDROID_IR_CLANG=$clang_bin" >> "$GITHUB_ENV"

      - name: Restore pinned Android SDK and NDK
        id: android-sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .android-sdk
          key: android-sdk-linux-platform${{ steps.toolchain.outputs.compile_sdk }}-build-tools${{ steps.toolchain.outputs.build_tools_version }}-ndk${{ steps.toolchain.outputs.ndk_version }}

      - name: Install pinned Android SDK and NDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source android/toolchain.properties
          hosted_sdk_root=/usr/local/lib/android/sdk
          sdkmanager_candidate="$hosted_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_candidate" ]]; then
            sdkmanager_candidate="$(command -v sdkmanager || true)"
          fi
          [[ -n "$sdkmanager_candidate" && -x "$sdkmanager_candidate" ]] || {
            echo "sdkmanager was not found in $hosted_sdk_root or on PATH" >&2
            exit 1
          }
          sdkmanager_bin="$(readlink -f "$sdkmanager_candidate")"
          hosted_sdk_root="$(cd -- "$(dirname -- "$sdkmanager_bin")/../../.." && pwd -P)"
          echo "Using sdkmanager: $sdkmanager_bin"
          echo "Hosted Android SDK: $hosted_sdk_root"
          echo "Cached Android SDK: $ANDROID_SDK_ROOT"

          install -d "$ANDROID_SDK_ROOT/licenses"
          if [[ -d "$hosted_sdk_root/licenses" ]]; then
            cp -a "$hosted_sdk_root/licenses/." "$ANDROID_SDK_ROOT/licenses/"
          fi

          set +e
          set +o pipefail
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          set -e
          [[ "$license_status" -eq 0 ]] || {
            echo "sdkmanager --licenses failed with exit code $license_status" >&2
            exit "$license_status"
          }

          "$sdkmanager_bin" --sdk_root="$ANDROID_SDK_ROOT" --channel=0 --verbose \
            'platform-tools' \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION"

      - name: Verify Android SDK cache contents
        run: |
          source android/toolchain.properties
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -f "$ANDROID_SDK_ROOT/platforms/android-$COMPILE_SDK/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          test -f "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/source.properties"

      - name: Generate Gradle configuration metadata
        run: |
          mkdir -p build/android/generated
          python3 tools/android_audit.py version \
            --source src/main.odin \
            --version-file android/version-code.properties \
            --output build/android/generated/version.properties

      - name: Restore pinned Gradle and AGP cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle-home
          key: gradle-linux-${{ steps.toolchain.outputs.gradle_version }}-agp${{ steps.toolchain.outputs.agp_version }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/toolchain.properties') }}

      - name: Provision pinned Gradle and AGP with network access
        run: bash android/gradlew -p android --no-daemon --stacktrace :app:tasks

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCH_ROGUE_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || {
            echo "ARCH_ROGUE_ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          }
          install -d -m 0700 "$RUNNER_TEMP/arch-rogue-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/arch-rogue-signing/release.keystore"
          chmod 0600 "$RUNNER_TEMP/arch-rogue-signing/release.keystore"

      - name: Build and audit signed release APK and AAB
        # Preserve the existing Python-era environment secret names and map
        # them to the clearer local names used by the Odin build wrapper.
        # Hosted CI may resolve transitive tools selected by the pinned AGP;
        # local Android builds remain offline unless explicitly opted in.
        env:
          ARCH_ROGUE_GRADLE_ONLINE: "1"
          ARCH_ROGUE_ANDROID_KEYSTORE: ${{ runner.temp }}/arch-rogue-signing/release.keystore
          ARCH_ROGUE_ANDROID_STORE_PASSWORD: ${{ secrets.ARCH_ROGUE_ANDROID_KEYSTORE_PASSWD }}
          ARCH_ROGUE_ANDROID_KEY_ALIAS: ${{ secrets.ARCH_ROGUE_ANDROID_KEYALIAS }}
          ARCH_ROGUE_ANDROID_KEY_PASSWORD: ${{ secrets.ARCH_ROGUE_ANDROID_KEYALIAS_PASSWD }}
        run: bash tools/android.sh release

      - name: Stage release-named Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_root="build/android/outputs"
          final_root="dist/android"
          install -d "$final_root"
          install -m 0644 "$source_root/Arch-Rogue.apk" "$final_root/Arch-Rogue.apk"
          install -m 0644 "$source_root/Arch-Rogue.aab" "$final_root/Arch-Rogue.aab"
          ls -lh "$final_root"

      - name: Remove restored signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/arch-rogue-signing"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-rogue-android-release
          path: |
            dist/android/*.apk
            dist/android/*.aab
          if-no-files-found: error
          retention-days: 7


  web:
    name: Build and audit WebAssembly distribution
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Inject manifest-locked licensed SFX
        env:
          ARCH_ROGUE_SFX_RELEASE_API_URL: https://api.github.com/repos/mattirk/arch-rogue-master/releases/tags/sfx-runtime
          ARCH_ROGUE_SFX_BUNDLE_AUTHORIZATION: ${{ secrets.ARCH_ROGUE_SFX_BUNDLE_AUTHORIZATION }}
        run: bash tools/fetch_private_sfx.sh

      - name: Read pinned toolchain metadata
        id: toolchain
        shell: bash
        run: bash tools/verify_toolchain.sh metadata >> "$GITHUB_OUTPUT"

      - name: Build exact Odin tag from source
        uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2
        with:
          release: "false"
          branch: ${{ steps.toolchain.outputs.odin_version }}
          llvm-version: ${{ steps.toolchain.outputs.odin_llvm_major }}
          build-type: release
          cache: "false"

      - name: Verify exact Odin snapshot
        run: bash tools/verify_toolchain.sh odin

      - name: Install web build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli

      - name: Restore pinned Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/emsdk
          key: emsdk-${{ hashFiles('web/toolchain.properties') }}

      - name: Install pinned Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          emsdk_version="${{ steps.toolchain.outputs.emsdk_version }}"
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$emsdk_version"
          "$HOME/emsdk/emsdk" activate "$emsdk_version"

      - name: Activate pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emsdk_version="${{ steps.toolchain.outputs.emsdk_version }}"
          "$HOME/emsdk/emsdk" activate "$emsdk_version"

      - name: Preflight, build, and audit web distribution
        run: bash build.sh web-build

      - name: Stage release-named web archive
        id: webpackage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.linux.outputs.version }}"
          sha12="${{ needs.linux.outputs.sha12 }}"
          archive="arch-rogue-v${version}-${sha12}-web.tar.gz"
          install -d dist
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --transform 's,^dist,arch-rogue-web,' \
            -czf "dist/$archive" -C build/web dist
          archive_listing="$RUNNER_TEMP/arch-rogue-web-archive.txt"
          tar -tzf "dist/$archive" > "$archive_listing"
          sed -n '1,5p' "$archive_listing"
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      # This exact audited archive feeds both the prerelease and the Pages
      # /play deployment. The Pages job downloads it rather than rebuilding.
      - name: Upload web release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-rogue-web
          path: ${{ steps.webpackage.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish automatic prerelease
    needs: [linux, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: arch-rogue-*
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.linux.outputs.version }}"
          sha12="${{ needs.linux.outputs.sha12 }}"
          test -f "release-assets/arch-rogue-v${version}-${sha12}-linux-x64.tar.gz"
          test -f "release-assets/Arch-Rogue.apk"
          test -f "release-assets/Arch-Rogue.aab"
          test -f "release-assets/arch-rogue-v${version}-${sha12}-web.tar.gz"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          ls -lh release-assets

      - name: Create or update automatic prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.linux.outputs.version }}-${{ needs.linux.outputs.sha12 }}
          name: Arch Rogue v${{ needs.linux.outputs.version }} (${{ needs.linux.outputs.sha12 }})
          target_commitish: ${{ github.sha }}
          body: |
            Automated Arch Rogue prerelease from `master` commit `${{ github.sha }}`.

            Release artifacts:
            - `arch-rogue-v${{ needs.linux.outputs.version }}-${{ needs.linux.outputs.sha12 }}-linux-x64.tar.gz` — Linux x64 launcher, binary, assets, and licenses
            - `Arch-Rogue.apk` — signed Android install package
            - `Arch-Rogue.aab` — signed Android App Bundle
            - `arch-rogue-v${{ needs.linux.outputs.version }}-${{ needs.linux.outputs.sha12 }}-web.tar.gz` — audited, self-hostable WebAssembly (WebGL2) build
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: "false"

  prepare-pages:
    name: Prepare download website
    needs: [linux, android, web, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download audited web release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-rogue-web
          path: pages-input/web

      - name: Assemble Pages site and playable web build
        shell: bash
        env:
          VERSION: ${{ needs.linux.outputs.version }}
          SHA12: ${{ needs.linux.outputs.sha12 }}
        run: |
          set -euo pipefail
          pages_root="build/pages"
          play_root="$pages_root/play"
          archive="pages-input/web/arch-rogue-v${VERSION}-${SHA12}-web.tar.gz"

          test -f "$archive"
          rm -rf "$pages_root"
          install -d "$play_root"
          cp -a website/. "$pages_root/"
          python3 tools/generate_download_manifest.py \
            --repository "${{ github.repository }}" \
            --version "$VERSION" \
            --commit "${{ github.sha }}" \
            --output "$pages_root/downloads.json"
          touch "$pages_root/.nojekyll"

          # Validate every tar member before writing anything. The release
          # archive must contain exactly one ordinary arch-rogue-web root;
          # links, devices, duplicate paths, traversal, and extra roots fail.
          python3 - "$archive" "$play_root" <<'PY'
          from __future__ import annotations

          import shutil
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          ARCHIVE_ROOT = "arch-rogue-web"
          archive = Path(sys.argv[1])
          play_root = Path(sys.argv[2])
          seen: set[PurePosixPath] = set()
          validated: list[tuple[tarfile.TarInfo, tuple[str, ...]]] = []

          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit("web Pages archive is empty")

              roots: set[str] = set()
              root_entries = 0
              for member in members:
                  raw_name = member.name
                  if raw_name.startswith(("/", "./")) or "\\" in raw_name:
                      raise SystemExit(f"unsafe web Pages archive path: {raw_name!r}")
                  parts = PurePosixPath(raw_name).parts
                  if not parts or any(part in {"", ".", ".."} for part in parts):
                      raise SystemExit(f"unsafe web Pages archive path: {raw_name!r}")
                  roots.add(parts[0])
                  if tuple(parts) == (ARCHIVE_ROOT,):
                      root_entries += 1
                      if not member.isdir():
                          raise SystemExit("web Pages archive root must be a directory")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"web Pages archive contains a link: {raw_name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"web Pages archive contains a special entry: {raw_name}")

                  relative = PurePosixPath(*parts[1:])
                  if relative in seen:
                      raise SystemExit(f"duplicate web Pages archive path: {relative}")
                  seen.add(relative)
                  validated.append((member, tuple(parts)))

              if roots != {ARCHIVE_ROOT} or root_entries != 1:
                  raise SystemExit(
                      "web Pages archive must contain exactly one arch-rogue-web root"
                  )

              for member, parts in validated:
                  relative_parts = parts[1:]
                  if not relative_parts:
                      continue
                  target = play_root.joinpath(*relative_parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read web Pages archive member: {member.name}")
                  with source, target.open("xb") as output:
                      shutil.copyfileobj(source, output)
                  target.chmod(member.mode & 0o777 or 0o644)
          PY

          test -f "$play_root/index.html"
          test -f "$play_root/packs.json"
          test -d "$play_root/packs"
          test ! -e "$play_root/arch-rogue-web"
          python3 tools/web_audit.py --dist "$play_root"

          python3 - "$pages_root" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          links = [path for path in root.rglob("*") if path.is_symlink()]
          if links:
              raise SystemExit(f"Pages site contains symbolic links: {links}")
          total = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          if total >= 1_000_000_000:
              raise SystemExit(f"Pages site is not below 1 GB: {total} bytes")
          print(f"Pages site ready: {total} bytes at {root}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website and game for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/pages

  deploy-pages:
    name: Deploy download website
    needs: prepare-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify deployed play route
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          index_file="$RUNNER_TEMP/arch-rogue-pages-index.html"
          packs_file="$RUNNER_TEMP/arch-rogue-pages-packs.json"
          retry=(
            --fail --silent --show-error --location
            --retry 12 --retry-delay 5 --retry-max-time 180 --retry-all-errors
          )

          # Keep these site-relative to page_url: project Pages currently lives
          # below /arch-rogue/, while a future custom domain may live at /.
          curl "${retry[@]}" --output "$index_file" "${base}play/"
          curl "${retry[@]}" --output "$packs_file" "${base}play/packs.json"
          grep -Fq 'window.AR_FILE_MANIFEST' "$index_file"
          python3 - "$packs_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if manifest.get("schema") != 2 or not manifest.get("packs"):
              raise SystemExit("deployed play/packs.json is invalid")
          print(f"deployed play route exposes {len(manifest['packs'])} asset packs")
          PY
